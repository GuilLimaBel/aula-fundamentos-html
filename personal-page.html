<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>

    <style>
        /* Faz o reset da margin e padding dos elementos */
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: aqua;
            font-family: "Luckiest Guy", cursive;
            font-weight: 400;
            font-style: normal;
        }

        h1, p {
            padding: 20px;
        }

        h2 {
            padding: 10px;
        }

        img {
            width: 250px;
            border-radius: 50%;
        }

        .bio {
             background-color: aliceblue;
             padding: 20px;
             border-radius: 10px;
             width: 500px;
             margin: 50px auto;
             text-align: center;
             position: absolute;
             top: 55%;
             left: 50%;
             transform: translate(-50%, -50%);
}

        ul{
            list-style-type: none;
        }
        
        li{
                padding: 5px;
        }
        a{
            text-decoration: none;

        }

        .logos {
            width: 32px;
        }

        

    </style>

</head>
<body>

    <div class="bio">

        <h1>Olá, sou o Guilherme</h1>
        <img src="f4.jpg" alt="Minha foto">
        <p>
            Tenho 16 anos, sou estudante de DEV.
        </p>

        <h2>Minhas especialidades</h2>
        <ul>
            <li>Página Web</li>
            <li>Aplicativos com React</li>
            <li>Banco de Dados</li>
            <li>Python</li>
        </ul>

        <h2>Meus Hobbies</h2>
        <ul>
            <li>Degustar a comida</li>
            <li>Jogar</li>
            <li>Soltar Pipa</li>
            <li>Dormir</li>
        </ul>

        <br>

        <a href="https://github.com/GuilLimaBel" target="_blank">
            <img class="logos" src ="github.png" alt="GitHub">
        </a>

        &nbsp;&nbsp;

        <a href="" target="_blank">
            <img class="logos" src="linkedin.png" alt="LinkedIn">
        </a>

    </div>

</body>
</html>
